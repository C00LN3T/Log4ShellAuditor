name: GitHub Traffic Badges

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual run

jobs:
  run:
    name: Make GitHub Traffic to Badge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Traffic Data
        uses: yi-Xu-0100/traffic-to-badge@v1.4.0
        with:
          my_token: ${{ secrets.GH_PAT }}
          static_list: ${{ github.repository }}
          traffic_branch: traffic
          views_color: 007ec6
          clones_color: 007ec6

      - name: Deploy to traffic branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./traffic
          publish_branch: traffic
